[package]
name = "kaizen"
version = "0.1.0"
description = "Local-first personal life tracker"
authors = ["MJTheGreat3"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
uuid = { version = "1.28.0", features = ["v7"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
hex = "0.4.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", features = ["serde"] }
base32 = "0.5.1"
tauri-plugin-dialog = "2.8.2"
zeroize = "1.9.1"
tauri-plugin-notification = "2.6.0"
flate2 = "1.1.10"
blake2 = "0.10"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.23.1"
tiny_http = "0.12"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.4.2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-focus = { path = "plugins/focus" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3.27.0"

# Key derivation (Argon2id) is far too slow unoptimised; optimise crypto crates in dev builds too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAPublicDefines", "block2"] }
